                if(!document.getElementById('form-data-validade').value) { btnSalvar.disabled = false; isSubmitting = false; btnSalvar.innerHTML = '<i class="ph ph-floppy-disk" style="font-size: 20px;"></i> Salvar Lançamento'; return alert("Preencha a Validade!"); }
            }

            if (isEdit) {
                let idx = registrosDoDiaAtivo.findIndex(r => String(r.linha) === String(linhaExistente));
                if(idx >= 0) { novoRegistro.editado = true; registrosDoDiaAtivo[idx] = novoRegistro; }
            } else { registrosDoDiaAtivo.push(novoRegistro); }

            salvarNoCelular();
            btnSalvar.disabled = false; btnSalvar.innerHTML = '<i class="ph ph-floppy-disk" style="font-size: 20px;"></i> Salvar Lançamento';

            if (outroLote === true && moduloAtivo === 'validade') {
                // mesmo produto, nova validade: limpa as quantidades e a data
                let prod = novoRegistro.produto;
                novoRegistroDia();
                selecionarProduto(prod);
                renderizarResumoDia();
                mostrarToast("💾 Lote salvo! Lance a próxima validade.");
            } else {
                voltarPara('tela-dia');
                if (document.getElementById('lista-detalhes-dia').style.display !== 'none' && produtoDetalheAtual) {
                    abrirDetalheProduto(produtoDetalheAtual);   // atualiza o detalhe aberto
                } else { mostrarResumoDia(); }
                renderizarResumoDia();
                mostrarToast("💾 Salvo local (Sincronizará sozinho)");
            }
            isSubmitting = false;
        }

        function excluirFormulario() {
            let linha = document.getElementById('form-linha').value;
            if (!linha) return;
            if (!confirm("Tem certeza que deseja excluir este lançamento?")) return;

            registrosDoDiaAtivo = registrosDoDiaAtivo.filter(r => String(r.linha) !== String(linha));
            salvarNoCelular();

            voltarPara('tela-dia');
            mostrarResumoDia();
            renderizarResumoDia();

            if (String(linha).startsWith("LOCAL_")) {
                mostrarToast("🗑️ Excluído da memória.");
                return;
            }

            let filaExclusao = JSON.parse(localStorage.getItem('lince_fila_exclusao')) || [];
            filaExclusao.push({ modulo: moduloAtivo, linha: linha });
            localStorage.setItem('lince_fila_exclusao', JSON.stringify(filaExclusao));
            mostrarToast("🗑️ Programado para excluir do Servidor.");
        }

        async function executarSincronizacao(exibirLoading) {
            if (isSyncing) return "O sistema já está sincronizando.";

            let filaExclusao = JSON.parse(localStorage.getItem('lince_fila_exclusao')) || [];
            let pendentes = registrosDoDiaAtivo.filter(r => String(r.linha).startsWith("LOCAL_") || r.editado);
            let IDsEnviados = pendentes.map(p => p.linha);

            if (filaExclusao.length === 0 && pendentes.length === 0) return true;

            isSyncing = true;
            if (exibirLoading) document.getElementById('overlay-sync').style.display = 'flex';

            if (filaExclusao.length > 0) {
                try {
                    let vasilhameExc = filaExclusao.filter(e => e.modulo === 'vasilhame').map(e => e.linha);
                    let validadeExc = filaExclusao.filter(e => e.modulo === 'validade').map(e => e.linha);

                    if(vasilhameExc.length > 0) await chamarAPI({ acao: 'excluir_lote', modulo: 'vasilhame', linhas: vasilhameExc });
                    if(validadeExc.length > 0) await chamarAPI({ acao: 'excluir_lote', modulo: 'validade', linhas: validadeExc });
                } catch(e) {
                    console.log("Erro ao limpar exclusões do servidor.");
                } finally {
                    localStorage.setItem('lince_fila_exclusao', JSON.stringify([]));
                }
            }

            if (pendentes.length > 0) {
                try {
                    let resLote = await chamarAPI({ acao: 'salvar_lote', modulo: moduloAtivo, registros: pendentes });
                    if (!resLote.sucesso) {
                        if(exibirLoading) document.getElementById('overlay-sync').style.display = 'none';
                        isSyncing = false;
                        return "Erro no Google Sheets: " + (resLote.erro || "Falha desconhecida");
                    }

                    registrosDoDiaAtivo = registrosDoDiaAtivo.filter(r => !(String(r.linha).startsWith("LOCAL_") && IDsEnviados.includes(r.linha)));
                    registrosDoDiaAtivo.forEach(r => { if(IDsEnviados.includes(r.linha)) r.editado = false; });
                    salvarNoCelular();

                } catch(e) {
                    if(exibirLoading) document.getElementById('overlay-sync').style.display = 'none';
                    isSyncing = false;
                    return "Falha de Conexão com o Servidor do Google. Tente novamente.";
                }
            }

            try {
                let res = await chamarAPI({ acao: 'buscar_dia', modulo: moduloAtivo, data: dataAtiva });
                if (res.sucesso) {
                    let backendDados = res.registros;
                    let aindaPendentes = registrosDoDiaAtivo.filter(r => String(r.linha).startsWith("LOCAL_") || r.editado);

                    registrosDoDiaAtivo = [...backendDados, ...aindaPendentes];
                    salvarNoCelular();

                    if (document.getElementById('tela-dia').style.display !== 'none') renderizarResumoDia();
                    if (!exibirLoading) mostrarToast("🔄 Sincronização em 2º plano concluída!");
                }
            } catch(e) {}

            // CORREÇÃO DOS FANTASMAS: Força o telemóvel a atualizar a memória do Histórico logo após a sincronização
            try {
                let resHist = await chamarAPI({ acao: 'buscar_historico', modulo: moduloAtivo });
                if (resHist.sucesso) {
                    localStorage.setItem('lince_hist_' + moduloAtivo, JSON.stringify(resHist.historico));
                    if (document.getElementById('tela-historico').style.display !== 'none') {
                        renderizarListaHistorico(resHist.historico);
                    }
                }
            } catch(e) {}

            if (exibirLoading) document.getElementById('overlay-sync').style.display = 'none';
            isSyncing = false;
            return true;
        }

        async function acionarGerarRelatorio() {
            let btn = document.getElementById('btn-gerar-relatorio');
            let user = "";
            if (moduloAtivo === 'vasilhame') {
                let itemNaTela = document.querySelector('.hist-item b');
                user = document.getElementById('form-usuario').value || (itemNaTela ? "MARIO CELSO DEVIDE" : prompt("Qual o seu nome para sair no relatório?"));
                if (!user) return;
            }

            let originalHTML = btn.innerHTML;
            btn.disabled = true;

            if (isSyncing) {
                btn.innerHTML = '<i class="ph ph-spinner ph-spin" style="font-size: 20px;"></i> Aguarde...';
                while(isSyncing) { await new Promise(r => setTimeout(r, 1000)); }
            } else {
                btn.innerHTML = '<i class="ph ph-arrows-clockwise ph-spin" style="font-size: 20px;"></i> Sincronizando...';
                let syncOk = await executarSincronizacao(true);
                if (syncOk !== true) {
                    alert("❌ Ocorreu um problema ao enviar os dados:\n\n" + syncOk);
                    btn.disabled = false; btn.innerHTML = originalHTML;
                    return;
                }
            }

            btn.innerHTML = '<i class="ph ph-rocket ph-spin" style="font-size: 20px;"></i> Gerando Arquivo...';
            mostrarToast("O Google está gerando o arquivo. Isso pode levar alguns segundos...");

            let payloadRel = { acao: moduloAtivo === 'vasilhame' ? 'gerar_pdf_vas' : 'gerar_excel', data: dataAtiva, usuario: user };

            chamarAPI(payloadRel).then(res => {
                btn.disabled = false; btn.innerHTML = originalHTML;
                if (res.sucesso) {
                    mostrarToast("✅ Relatório gerado com sucesso!");
                    if(res.link) { window.open(res.link, '_blank'); }
                    abrirDia(dataAtiva);
                }
                else { alert("❌ Erro ao gerar relatório: " + res.erro); }
            }).catch(e => {
                btn.disabled = false; btn.innerHTML = originalHTML;
                alert("⚠️ A conexão do celular expirou devido ao peso dos dados, MAS fique tranquilo:\n\nO relatório provavelmente foi gerado com sucesso no servidor. Verifique a pasta do seu Google Drive!");
            });
        }

        setInterval(() => { if (moduloAtivo && dataAtiva && navigator.onLine) executarSincronizacao(false); }, 300000);

        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === 'visible' && moduloAtivo && dataAtiva && navigator.onLine) {
                executarSincronizacao(false);
            }
        });
    </script>
</body>
</html>
